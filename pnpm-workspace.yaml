packages:
  - packages/*
  - apps/*
  - research/*
  - scripts

catalog:
  "@types/node": ^22.0.0
  tsx: ^4.23.15
  typescript: ^7.0.2
  vitest: ^5.1.0

# pnpm stops the install until each dependency's build script has a decision.
# esbuild's only speeds up its first run; the binary is an optional dependency.
# better-sqlite3's fetches or compiles the native module the keeper needs.
allowBuilds:
  better-sqlite3: true
  esbuild: false
