name: CI

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The vault's tests build the contract to wasm and run it on a local NEAR sandbox node.
      - run: rustup target add wasm32-unknown-unknown
      # near-workspaces builds each contract by running `cargo near`. The release binary,
      # checked against the hash published with cargo-near v0.23.0.
      - name: Install cargo-near 0.23.0
        run: |
          curl -sSfL -o /tmp/cargo-near.tar.gz https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz
          echo "94008b827a457750257eced4b571c33736062cc3bd1ffda3e7af70e2bc9a4073  /tmp/cargo-near.tar.gz" | sha256sum -c -
          tar xzf /tmp/cargo-near.tar.gz -C /tmp
          install /tmp/cargo-near-x86_64-unknown-linux-gnu/cargo-near ~/.cargo/bin/
          cargo near --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/vault
            contracts/vault/tests/mock-ft
      - uses: actions/cache@v6
        with:
          path: ~/.near-sandbox
          key: near-sandbox-2.14.0-${{ runner.os }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
