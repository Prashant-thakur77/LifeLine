[package]
name = "lifeline-vault"
description = "Lifeline's reserve vault: a user's USDC, sent only to their own Hyperliquid account through 1Click, only by the keeper they chose, within their own limits."
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Prashant-thakur77/LifeLine"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
near-workspaces = { version = "0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
ed25519-dalek = "2.2"
sha2 = "0.10"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
