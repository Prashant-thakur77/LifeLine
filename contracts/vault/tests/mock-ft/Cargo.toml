# A NEP-141 token for the vault's sandbox tests only. It can be told to fail transfers,
# so the tests can watch a failed rescue get refunded.
[package]
name = "mock-ft"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
